<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Syne:wght@500;600;700&display=swap');

*{margin:0;padding:0;box-sizing:border-box;}

body,#root{
  font-family:'Inter',sans-serif;
  background:#0f0f10;
  min-height:100vh;
  color:#e2e2e4;
}

#page{
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

/* NAV */
#nav{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 32px;
  height:52px;
  border-bottom:1px solid rgba(255,255,255,0.06);
  position:sticky;top:0;z-index:50;
  background:rgba(15,15,16,0.9);
  backdrop-filter:blur(16px);
}

#nav-left{
  display:flex;align-items:center;gap:8px;
}

.wdot{width:11px;height:11px;border-radius:50%;}
.wd-r{background:#ff5f57;}.wd-y{background:#ffbd2e;}.wd-g{background:#28c840;}

#nav-title{
  font-size:13px;font-weight:500;
  color:rgba(255,255,255,0.25);
  letter-spacing:0.6px;
  margin-left:16px;
}

#nav-right{
  display:flex;align-items:center;gap:12px;
}

#switch-pill{
  display:flex;align-items:center;gap:7px;
  padding:5px 12px 5px 6px;
  border-radius:100px;
  border:1px solid rgba(255,255,255,0.09);
  background:rgba(255,255,255,0.04);
  cursor:pointer;
  transition:background 0.2s,border-color 0.2s;
  user-select:none;
}
#switch-pill:hover{background:rgba(255,255,255,0.07);border-color:rgba(255,255,255,0.15);}

#pill-avatar{
  width:24px;height:24px;border-radius:50%;
  background:#1c1c1f;
  border:1px solid rgba(255,255,255,0.1);
  display:flex;align-items:center;justify-content:center;
  font-size:13px;
  overflow:hidden;flex-shrink:0;
}

#pill-name{font-size:12px;font-weight:500;color:rgba(255,255,255,0.5);}

#pill-icon{
  width:13px;height:13px;
  color:rgba(255,255,255,0.28);
  transition:transform 0.25s;
  flex-shrink:0;
}
#switch-pill:hover #pill-icon{transform:translateX(2px);}

/* MAIN LAYOUT */
#main{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:40px 24px;
}

#card{
  width:100%;
  max-width:420px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:0;
}

/* AVATAR */
#av-wrap{
  position:relative;
  margin-bottom:24px;
}

#av-outer{
  width:96px;height:96px;
  border-radius:50%;
  padding:2px;
  transition:background 0.6s ease;
  background:rgba(255,255,255,0.07);
}
#av-outer.ko{background:linear-gradient(135deg,rgba(138,180,248,0.4),rgba(97,131,237,0.2));}
#av-outer.no{background:linear-gradient(135deg,rgba(248,163,192,0.4),rgba(220,120,170,0.2));}

#av-inner{
  width:100%;height:100%;
  border-radius:50%;
  background:#18181b;
  display:flex;align-items:center;justify-content:center;
  font-size:40px;
  overflow:hidden;
}

#av-dot{
  position:absolute;bottom:4px;right:4px;
  width:13px;height:13px;border-radius:50%;
  background:#34d058;
  border:2.5px solid #0f0f10;
}

/* PROFILE TEXT */
#pinfo{
  text-align:center;
  margin-bottom:32px;
}

#pname{
  font-family:'Syne',sans-serif;
  font-size:28px;font-weight:700;
  color:#f5f5f6;
  letter-spacing:-0.5px;
  line-height:1.15;
  transition:opacity 0.25s;
}

#phandle{
  font-size:13px;font-weight:400;
  color:rgba(255,255,255,0.32);
  margin-top:5px;
  letter-spacing:0.2px;
  transition:opacity 0.25s;
}

#pbadge{
  display:inline-flex;align-items:center;gap:5px;
  margin-top:12px;
  padding:4px 13px;
  border-radius:100px;
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.07);
  font-size:11px;letter-spacing:0.5px;font-weight:500;
  color:rgba(255,255,255,0.28);
  transition:border-color 0.5s,color 0.5s;
}
#pbadge.ko{border-color:rgba(138,180,248,0.2);color:rgba(138,180,248,0.6);}
#pbadge.no{border-color:rgba(248,163,192,0.2);color:rgba(248,163,192,0.6);}

#heart-ico{display:inline-block;animation:hb 1.9s ease-in-out infinite;}
@keyframes hb{0%,100%{transform:scale(1)}45%{transform:scale(1.4)}}

/* LINKS */
#links{
  width:100%;
  display:flex;flex-direction:column;
  gap:6px;
}

.lk{
  display:flex;align-items:center;gap:12px;
  padding:12px 14px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,0.06);
  background:rgba(255,255,255,0.025);
  cursor:pointer;
  text-decoration:none;
  transition:background 0.18s,border-color 0.18s,transform 0.15s;
  position:relative;overflow:hidden;
}
.lk:hover{
  background:rgba(255,255,255,0.055);
  border-color:rgba(255,255,255,0.11);
  transform:translateX(3px);
}
.lk:active{transform:translateX(1px) scale(0.99);}

.lk-ico{
  width:34px;height:34px;border-radius:9px;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.lk-ico svg{width:16px;height:16px;display:block;}

.ico-d{background:rgba(88,101,242,0.12);}
.ico-t{background:rgba(240,240,255,0.06);}
.ico-s{background:rgba(255,149,0,0.1);}
.ico-b{background:rgba(52,211,88,0.1);}

.lk-body{flex:1;min-width:0;}
.lk-lbl{font-size:13px;font-weight:500;color:#d4d4d8;line-height:1;}
.lk-sub{
  font-size:11px;color:rgba(255,255,255,0.28);
  margin-top:3px;letter-spacing:0.2px;
  transition:color 0.5s;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.lk-sub.ko{color:rgba(138,180,248,0.45);}
.lk-sub.no{color:rgba(248,163,192,0.45);}

.lk-arr{
  color:rgba(255,255,255,0.18);
  font-size:16px;line-height:1;
  opacity:0;transform:translateX(-3px);
  transition:opacity 0.15s,transform 0.15s;
  flex-shrink:0;
}
.lk:hover .lk-arr{opacity:1;transform:translateX(0);}

/* FOOTER */
#footer{
  margin-top:28px;
  display:flex;align-items:center;gap:8px;
  font-size:11px;color:rgba(255,255,255,0.16);
  letter-spacing:0.4px;
}
.fdot{width:3px;height:3px;border-radius:50%;background:rgba(255,255,255,0.13);}

/* AMBIENT */
#amb{
  position:fixed;
  width:500px;height:500px;
  border-radius:50%;
  top:50%;left:50%;
  transform:translate(-50%,-60%);
  filter:blur(120px);
  opacity:0.055;
  pointer-events:none;
  transition:background 0.8s ease;
  z-index:0;
}
#amb.ko{background:#8ab4f8;}
#amb.no{background:#f8a3c0;}

/* TOAST */
#toast{
  position:fixed;bottom:28px;left:50%;
  transform:translateX(-50%) translateY(16px);
  background:#1c1c1f;
  border:1px solid rgba(255,255,255,0.1);
  color:rgba(255,255,255,0.6);
  padding:7px 16px;border-radius:100px;
  font-size:11px;font-weight:500;letter-spacing:0.3px;
  opacity:0;pointer-events:none;white-space:nowrap;
  transition:all 0.28s cubic-bezier(0.34,1.5,0.64,1);
  z-index:99;
}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0);}

/* Transition helpers */
.fade-out-up{animation:fou 0.2s ease forwards;}
.fade-in-down{animation:fid 0.3s ease forwards;}
@keyframes fou{to{opacity:0;transform:translateY(8px)}}
@keyframes fid{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}

/* RESPONSIVE */
@media(max-width:600px){
  #nav{padding:0 18px;}
  #nav-title{display:none;}
  #main{padding:28px 16px;}
  #av-outer{width:84px;height:84px;}
  #av-inner{font-size:34px;}
  #pname{font-size:24px;}
  #card{max-width:100%;}
}
@media(min-width:900px){
  #card{max-width:380px;}
}
</style>

<div id="page">

      <div class="wdot wd-g"></div>
      <span id="nav-title">kei.nash</span>
    </div>
    <div id="nav-right">
      <div id="switch-pill" onclick="doSwitch()">
        <div id="pill-avatar">🌸</div>
        <span id="pill-name">Nash</span>
        <svg id="pill-icon" viewBox="0 0 16 16" fill="none">
          <path d="M6 4l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

      <div id="av-wrap">

      <div id="pinfo">

          <span id="heart-ico">♥</span>

          <div class="lk-ico ico-d">

              <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057c.002.022.015.043.033.054a19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128c.126-.094.252-.192.372-.292a.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.1.246.198.373.292a.077.077 0 0 1-.006.127 12.3 12.3 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03z" fill="#5865F2"/>

</div>

<div id="toast"></div>

<script>
const P={
  kei:{emoji:'🧊',name:'Kei',handle:'@kei_tiktok',cl:'ko',
    discord:'@kei',tiktok:'@kei_tiktok',saweria:'Dukung Kei',socobuz:"Kei's socobuz",
    partner:{name:'Nash',emoji:'🌸'},footerWith:'Nash'},
  nash:{emoji:'🌸',name:'Nash',handle:'@nash_tiktok',cl:'no',
    discord:'@nash',tiktok:'@nash_tiktok',saweria:'Dukung Nash',socobuz:"Nash's socobuz",
    partner:{name:'Kei',emoji:'🧊'},footerWith:'Kei'}
};

let cur='kei';
let busy=false;

function doSwitch(){
  if(busy)return;
  busy=true;
  cur=cur==='kei'?'nash':'kei';
  const p=P[cur],q=P[cur==='kei'?'nash':'kei'];

  const toAnim=['pname','phandle'];
  toAnim.forEach(id=>{
    const el=document.getElementById(id);
    el.classList.add('fade-out-up');
  });

  setTimeout(()=>{
    document.getElementById('av-emoji').textContent=p.emoji;
    document.getElementById('av-outer').className=p.cl;
    document.getElementById('amb').className=p.cl;
    document.getElementById('pbadge').className=p.cl;

    document.getElementById('pname').textContent=p.name;
    document.getElementById('phandle').textContent=p.handle;
    document.getElementById('fn').textContent=p.name;

    document.getElementById('pill-avatar').textContent=q.emoji;
    document.getElementById('pill-name').textContent=q.name;

    document.getElementById('sub-discord').textContent=p.discord;
    document.getElementById('sub-tiktok').textContent=p.tiktok;
    document.getElementById('sub-saweria').textContent=p.saweria;
    document.getElementById('sub-socobuz').textContent=p.socobuz;

    document.querySelectorAll('.lk-sub').forEach(el=>{
      el.className='lk-sub '+p.cl;
    });

    toAnim.forEach(id=>{
      const el=document.getElementById(id);
      el.classList.remove('fade-out-up');
      el.classList.add('fade-in-down');
      setTimeout(()=>el.classList.remove('fade-in-down'),350);
    });

    showToast('Switched to '+p.name);
    setTimeout(()=>{busy=false;},350);
  },200);
}

function openLink(e,name){
  e.preventDefault();
  showToast('Opening '+name+'...');
}

let tt;
function showToast(msg){
  const t=document.getElementById('toast');
  clearTimeout(tt);
  t.textContent=msg;t.classList.add('on');
  tt=setTimeout(()=>t.classList.remove('on'),2200);
}

document.addEventListener('contextmenu',e=>{e.preventDefault();showToast('Protected ✦');});
document.addEventListener('keydown',e=>{
  if(e.key==='F12'||(e.ctrlKey&&e.shiftKey&&'IJC'.includes(e.key))||(e.ctrlKey&&['u','U'].includes(e.key))){
    e.preventDefault();showToast('Not allowed here ✦');
  }
});
document.addEventListener('selectstart',e=>e.preventDefault());
</script>
